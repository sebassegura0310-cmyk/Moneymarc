<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b126b">
  <title>Córdoba Préstamos MX</title>

  <style>
    :root {
      --morado: #3b126b;
      --morado-medio: #762bd1;
      --morado-claro: #b24be8;
      --fondo: #f7f1ff;
      --texto: #251333;
      --blanco: #fff;
      --lila: #f0c8ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--texto);
      background: var(--fondo);
      font-family: Inter, system-ui, Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .contenedor {
      width: min(1120px, 92%);
      margin: auto;
    }

    header,
    .hero,
    footer {
      color: var(--blanco);
      background: linear-gradient(135deg, #3b126b, #762bd1 55%, #b24be8);
    }

    header {
      padding: 18px 0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .marca {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .boton {
      display: inline-block;
      border: 0;
      border-radius: 999px;
      padding: 13px 20px;
      background: linear-gradient(135deg, #f0c8ff, #ffd1ee);
      color: var(--morado);
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s, opacity .2s;
    }

    .boton:hover {
      transform: translateY(-2px);
      opacity: .9;
    }

    .hero {
      padding: 72px 0 88px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 42px;
      align-items: center;
    }

    .etiqueta {
      color: #f0c8ff;
      font-weight: 700;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4.8rem);
      line-height: 1.02;
      margin: 16px 0;
    }

    .hero p {
      color: #f0e3fa;
      line-height: 1.7;
      max-width: 540px;
    }

    .tarjeta {
      background: var(--blanco);
      color: var(--texto);
      border: 1px solid #ead8fb;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 12px 35px #54208018;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d8cedf;
      border-radius: 12px;
      font: inherit;
    }

    input[type="range"] {
      padding: 0;
      accent-color: #8b35cf;
      cursor: pointer;
    }

    .monto {
      color: var(--morado);
      font-size: 1.8rem;
      font-weight: 800;
    }

    .resultado {
      background: linear-gradient(135deg, #f3e6ff, #fceaff);
      padding: 16px;
      border-radius: 14px;
      margin: 18px 0;
      line-height: 1.8;
    }

    .ancho {
      width: 100%;
      text-align: center;
    }

    section {
      padding: 70px 0;
    }

    h2 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      margin: 0 0 14px;
    }

    .subtitulo {
      color: #665775;
      line-height: 1.7;
    }

    .pasos,
    .opciones {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 28px;
    }

    .caja {
      background: var(--blanco);
      border: 1px solid #ead8fb;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 35px #54208018;
    }

    .numero {
      color: #8b35cf;
      font-size: 1.5rem;
      font-weight: 800;
    }

    .aviso {
      background: #fff8df;
      border-left: 4px solid #d0a400;
      padding: 16px;
      border-radius: 10px;
      line-height: 1.6;
      font-size: .92rem;
    }

    footer {
      padding: 28px 0;
    }

    footer p {
      color: #f0e3fa;
      font-size: .88rem;
      line-height: 1.6;
    }

    @media (max-width: 760px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .nav-links a:not(.boton) {
        display: none;
      }

      .pasos,
      .opciones {
        grid-template-columns: 1fr;
      }

      .hero {
        padding: 52px 0 65px;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="contenedor">
      <a class="marca" href="#">Córdoba Préstamos MX</a>

      <div class="nav-links">
        <a href="#como-funciona">Cómo funciona</a>
        <a href="#opciones">Opciones</a>
        <a class="boton" href="#opciones">Ver opciones</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="contenedor hero-grid">
        <div>
          <span class="etiqueta">SENCILLO Y CLARO</span>
          <h1>Una opción de préstamo a tu medida.</h1>
          <p>
            Explora montos y plazos estimados. Revisa las condiciones antes
            de enviar una solicitud.
          </p>
          <a class="boton" href="#calculadora">Calcular mi pago</a>
        </div>

        <div class="tarjeta" id="calculadora">
          <h2 style="font-size: 1.5rem">Haz una estimación</h2>

          <label for="monto">¿Cuánto necesitas?</label>
          <div class="monto" id="montoTexto">$10,000 MXN</div>

          <input
            id="monto"
            type="range"
            min="1000"
            max="50000"
            step="500"
            value="10000"
          >

          <select id="plazo">
